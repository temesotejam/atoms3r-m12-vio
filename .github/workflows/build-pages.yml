name: Build firmware and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build AtomS3R-M12 firmware
        run: pio run -d firmware

      - name: Assemble web-flash image
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site/firmware
          cp -r web/* site/

          BUILD="firmware/.pio/build/atoms3r_m12"
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin | head -n 1)"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"

          python "$ESPTOOL" --chip esp32s3 merge_bin             -o site/firmware/atoms3r-m12-vio.bin             0x0000 "$BUILD/bootloader.bin"             0x8000 "$BUILD/partitions.bin"             0xe000 "$BOOT_APP0"             0x10000 "$BUILD/firmware.bin"

          cp "$BUILD/firmware.bin" site/firmware/app-only.bin
          ls -lh site/firmware

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atoms3r-m12-vio-firmware
          path: site/firmware/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
